<!DOCTYPE html>
<html>

<head>

    <title>Add Member</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-page">

    <h1>Add New Member</h1>

    <form action="/members/add" method="POST">

        <label>Member Name</label>

        <input
            type="text"
            name="name"
            required
        >


        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >


        <label>Phone</label>

        <input
            type="text"
            name="phone"
            required
        >


        <button type="submit">
            Add Member
        </button>

    </form>


    <a href="/members" class="back">
        ← Back to Members
    </a>

</div>

</body>
</html>
