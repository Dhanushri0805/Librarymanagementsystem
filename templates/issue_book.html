<!DOCTYPE html>
<html>

<head>

    <title>Issue Book</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-page">

    <h1>Issue Book</h1>

    <form action="/issue" method="POST">

        <label>Select Book</label>

        <select name="book_id" required>

            <option value="">
                Select a Book
            </option>

            {% for book in books %}

            <option value="{{ book['id'] }}">

                {{ book['title'] }}
                - Available: {{ book['quantity'] }}

            </option>

            {% endfor %}

        </select>


        <label>Select Member</label>

        <select name="member_id" required>

            <option value="">
                Select a Member
            </option>

            {% for member in members %}

            <option value="{{ member['id'] }}">

                {{ member['name'] }}

            </option>

            {% endfor %}

        </select>


        <label>Issue Date</label>

        <input
            type="date"
            name="issue_date"
            required
        >


        <button type="submit">
            Issue Book
        </button>

    </form>


    <a href="/" class="back">
        ← Dashboard
    </a>

</div>

</body>
</html>
