<!DOCTYPE html>
<html>

<head>

    <title>Books</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="page">

    <div class="page-header">

        <h1>Book Management</h1>

        <a href="/books/add" class="button">
            + Add Book
        </a>

    </div>


    <table>

        <tr>

            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Publisher</th>
            <th>Category</th>
            <th>Year</th>
            <th>Quantity</th>
            <th>Action</th>

        </tr>


        {% for book in books %}

        <tr>

            <td>{{ book["id"] }}</td>

            <td>{{ book["title"] }}</td>

            <td>{{ book["author"] }}</td>

            <td>{{ book["publisher"] }}</td>

            <td>{{ book["category"] }}</td>

            <td>{{ book["year"] }}</td>

            <td>{{ book["quantity"] }}</td>

            <td>

                <a
                    href="/books/edit/{{ book['id'] }}"
                    class="edit"
                >
                    Edit
                </a>

                <a
                    href="/books/delete/{{ book['id'] }}"
                    class="delete"
                >
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>


    <br>

    <a href="/" class="back">← Dashboard</a>

</div>

</body>
</html>
